name: Deploy Firestore rules

# Auto-publishes firestore.rules to Firebase whenever it changes on main, so the
# rules never have to be hand-pasted into the Firebase console again.
#
# One-time setup: add a single repo secret FIREBASE_SERVICE_ACCOUNT — the JSON key
# for a service account with the "Firebase Rules Admin" (or Editor) role. The
# project id is read out of that JSON, so no second secret is needed.
#   Firebase console → Project settings → Service accounts → Generate new private key
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools

      - name: Deploy rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT_ID="$(node -e "process.stdout.write(require('$RUNNER_TEMP/sa.json').project_id)")"
          echo "Deploying firestore.rules to project: $PROJECT_ID"
          firebase deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
